<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, user-scalable=0"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="description" content="Karte aller Schulen in Deutschland (Daten: jedeschule.codefor.de)" />

    <title>Jede Schule – Karte</title>
    <link rel="icon" href="./resources/img/schule.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./mastercode/3_7_0/css/masterportal.css" />
    <style>
      /* Layout tweaks taken over from the Berlin gärtnert portal */
      .mp-menu-logo {
        justify-content: center !important;
      }
      .mp-menu-logo img {
        max-height: 100px !important;
      }
      .mp-menu-logo h1:empty {
        display: none; /* no title text, so the round logo is centred */
      }
      .layer-component-icon-sub-menu { /* no opacity slider in the layer tree */
        display: none !important;
      }
      .layerPreview[title] {
        pointer-events: none;
      }
      #accordion-container-layer-info-contact {
        display: none;
      }
      /* The secondary menu only shows school details (opened by clicking the map),
         so its toggle button with the tools icon is not needed */
      #secondaryMenu-toggle-button {
        display: none !important;
      }
    </style>
  </head>

  <body>
    <div id="masterportal-root"></div>
    <script
      type="text/javascript"
      src="./mastercode/3_7_0/js/masterportal.js"
    ></script>
  </body>
</html>
